on:
  workflow_call:
    inputs:
      php_version:
        description: "PHP version to use"
        default: "8.4"
        type: string
      node_version:
        description: "Node version to use"
        default: "24"
        type: string
      composer_version:
        description: "Composer version"
        default: "v2"
        type: string
      use_python:
        description: "Should Python be set up"
        default: false
        type: boolean
      python_version:
        description: "Python version to use"
        default: "3.13"
        type: string
      python_requirements:
        description: "Path to the Python requirements file, installed if it exists"
        default: "requirements.txt"
        type: string
      fetch_submodules:
        description: "Should submodules be fetched"
        default: true
        type: boolean
      use_npm_token:
        description: "Should NPM token be used"
        default: false
        type: boolean
      platform:
        description: "What platform should the action run on"
        default: "ubuntu-latest"
        type: string
      artifact:
        description: "Name of the artifact"
        default: "build_files"
        type: string
      slack_channel:
        description: "Slack channel ID to post notifications to"
        default: ""
        type: string
    secrets:
      COMPOSER_AUTH:
        required: true
      SLACK_BOT_TOKEN:
        required: false
      PRIVATE_KEY:
        required: false
      BUILD_NPM_TOKEN:
        required: false
      # Declared so callers can pass secrets explicitly instead of `secrets: inherit`.
      TOKEN_PRIVATE_KEY:
        description: "Private key of the GitHub App that checks out submodules and Composer packages"
        required: false
      FONT_AWESOME_PRO_TOKEN:
        description: "Font Awesome Pro npm token, for projects that use it"
        required: false

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    steps:
      - id: slack
        if: ${{ inputs.slack_channel != '' }}
        name: Slack notification (start)
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        with:
          # The following message update step does not accept a channel name.
          # Setting a channel ID here for consistency is highly recommended.
          channel-id: ${{ inputs.slack_channel }}
          payload: |
            {
              "text": ":construction_worker: ${{ github.repository }} build ${{ github.ref_name }} by ${{ github.actor }} started.",
              "attachments": [
                {
                  "pretext": ":hammer: Building...",
                  "color": "dbab09",
                  "fields": [
                    {
                      "title": "Status",
                      "short": true,
                      "value": "In Progress"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fetch Github token for Composer
        id: composer-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: ${{ inputs.fetch_submodules }}
          token: ${{ steps.composer-token.outputs.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:${{ inputs.composer_version }}

      - name: Check for Python requirements
        id: python-requirements
        if: ${{ inputs.use_python }}
        run: |
          if [ -f "${{ inputs.python_requirements }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: ${{ inputs.use_python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python_version }}
          # setup-python fails on a missing dependency file, so only cache when it exists.
          cache: ${{ steps.python-requirements.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.python_requirements }}

      - name: Install Python dependencies
        if: ${{ inputs.use_python && steps.python-requirements.outputs.exists == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ inputs.python_requirements }}"

      - name: Add GH Oauth token to Composer
        run: |
          SITE_URL="${{ vars.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://jco.fi"
          fi
          MERGED_COMPOSER_AUTH=$(jq -c \
            --arg gh_token "${{ steps.composer-token.outputs.token }}" \
            --arg old_url "https://jco.fi" \
            --arg new_url "$SITE_URL" \
            'walk(if type == "string" then gsub($old_url; $new_url) else . end) | . + {"github-oauth":{"github.com": $gh_token}}' \
            <<< '${{ secrets.COMPOSER_AUTH }}')
          echo "COMPOSER_AUTH=$MERGED_COMPOSER_AUTH" >> $GITHUB_ENV

      - name: Set Font Awesome Pro Token
        run: |
          pnpm config set @fortawesome:registry=https://npm.fontawesome.com/
          pnpm config set //npm.fontawesome.com/:_authToken=${{ secrets.FONT_AWESOME_PRO_TOKEN }}

      - name: Configure Git to use GitHub App Token
        if: ${{ steps.composer-token.outputs.token != '' && vars.ENABLE_GITHUB_NPM_AUTH == 'true' }}
        run: |
          git config --global url."https://x-access-token:${{ steps.composer-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Set NPM token
        if: ${{ inputs.use_npm_token }}
        run: |
          pnpm config set //registry.npmjs.org/:_authToken=${{ secrets.BUILD_NPM_TOKEN }}

      - name: Make
        run: make ci

      - name: Upload built files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact }}
          path: |
            .
            !node_modules
            !.git*
            !**/node_modules
            !**/__pycache__
            !**/.venv
          retention-days: 1

      - uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        name: Slack notification (success)
        if: ${{ success() && inputs.slack_channel != '' }}
        with:
          # Unlike the step posting a new message, this step does not accept a channel name.
          # Please use a channel ID, not a name here.
          channel-id: ${{ inputs.slack_channel }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "text": ":white_check_mark: ${{ github.repository }} build ${{ github.ref_name }} by ${{ github.actor }} finished.",
              "attachments": [
                {
                  "pretext": ":house_with_garden: Finished building",
                  "color": "28a745",
                  "fields": [
                    {
                      "title": "Status",
                      "short": true,
                      "value": "Completed"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        name: Slack notification (failure)
        if: ${{ failure() && inputs.slack_channel != '' }}
        with:
          # Unlike the step posting a new message, this step does not accept a channel name.
          # Please use a channel ID, not a name here.
          channel-id: ${{ inputs.slack_channel }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "text": ":x: ${{ github.repository }} build ${{ github.ref_name }} started by ${{ github.actor }} failed!",
              "attachments": [
                {
                  "pretext": ":fire: Failed to build",
                  "color": "e11d21",
                  "fields": [
                    {
                      "title": "Status",
                      "short": true,
                      "value": "Failed"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
