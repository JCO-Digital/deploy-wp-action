on:
  workflow_call:
    inputs:
      php_version:
        description: "PHP version to use"
        default: "8.2"
        type: string
      node_version:
        description: "Node version to use"
        default: "20"
        type: string
      deploy_vendor:
        description: "Deploy vendor folder"
        default: true
        type: boolean
      deploy_plugins:
        description: "Deploy plugins folder"
        default: false
        type: boolean
      is_jcore2:
        description: "Is JCORE2 theme"
        default: false
        type: boolean
      server_url:
        description: "Server URL"
        required: true
        type: string
      base_path:
        description: "Base path"
        required: true
        type: string
      theme_name:
        description: "Theme name"
        required: true
        type: string
    secrets:
      SSH_GITHUB_KEY:
        required: true
      COMPOSER_AUTH:
        required: true
      VC_HOSTS:
        required: true

jobs:
  deploy:
    name: Deploy site
    runs-on: [self-hosted, Linux, X64]
    env:
      SERVER_URL: ${{ inputs.server_url }}:${{ inputs.base_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_GITHUB_KEY }}
          name: id_ed25519
          known_hosts: ${{ secrets.VC_HOSTS }}

      - name: Add Bitbucket Known Hosts
        if: ${{ inputs.is_jcore2 }}
        run: echo BITBUCKET_KNOWN_HOSTS="$(ssh-keyscan -t rsa bitbucket.org)" >> $GITHUB_ENV

      - name: Install Bitbucket Key
        if: ${{ inputs.is_jcore2 }}
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_GITHUB_KEY }}
          name: id_ed25519_bitbucket
          known_hosts: ${{ env.BITBUCKET_KNOWN_HOSTS }}

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ inputs.node_version }}

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:v2

      - name: Make
        run: make ci
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Deploy Vendor
        if: ${{ inputs.deploy_vendor }}
        run: rsync -rlci --delete vendor ${{ env.SERVER_URL }}

      - name: Deploy Plugins
        if: ${{ inputs.deploy_plugins }}
        run: rsync -rlci --delete wp-content/plugins/ ${{ env.SERVER_URL }}/wp-content/plugins/

      - name: Deploy Theme
        run: rsync -rlci --delete --exclude=node_modules wp-content/themes/${{ inputs.theme_name }} ${{ env.SERVER_URL }}/wp-content/themes/

      - name: Deploy JCORE2
        if: ${{ inputs.is_jcore2 }}
        run: rsync -rlci --delete --exclude=node_modules wp-content/themes/jcore2 ${{ env.SERVER_URL }}/wp-content/themes/
