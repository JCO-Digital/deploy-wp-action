on:
  workflow_call:
    inputs:
      server_url:
        required: true
        type: string
      base_path:
        required: true
        type: string
      paths:
        required: true
        type: string
      exclude:
        default: "{'node_modules','__pycache__','.venv','.git','.github','.env','.idea','.vscode','.DS_Store'}"
        type: string
      platform:
        description: "What platform should the action run on"
        default: "ubuntu-latest"
        type: string
      artifact:
        description: "Name of the artifact"
        default: "build_files"
        type: string
      slack_channel:
        description: "Slack channel ID to post notifications to"
        default: ""
        type: string
      ssh_port:
        description: "SSH port"
        default: 22
        type: number

    secrets:
      SSH_GITHUB_KEY:
        required: true
      SLACK_BOT_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ${{ inputs.platform }}
    env:
      EXCLUDE: ${{ inputs.exclude }}
    steps:
      - id: slack
        if: ${{ inputs.slack_channel != '' }}
        name: Slack notification (start)
        uses: slackapi/slack-github-action@v1
        with:
          # The following message update step does not accept a channel name.
          # Setting a channel ID here for consistency is highly recommended.
          channel-id: ${{ inputs.slack_channel }}
          payload: |
            {
              "text": ":construction_worker: ${{ github.repository }} deployment ${{ github.ref_name }} to ${{ inputs.server_url }} started.",
              "attachments": [
                {
                  "pretext": ":airplane_departure: Deploying...",
                  "color": "dbab09",
                  "fields": [
                    {
                      "title": "Status",
                      "short": true,
                      "value": "In Progress"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_GITHUB_KEY }}
          name: id_ed25519
          known_hosts: ${{ vars.WP_DEPLOY_SSH_HOSTS }}

      # This will parse the paths "local:remote,local" and create a list of paths to deploy.
      # If only local is provided, remote will be the same as local.
      # Preceding slashes are added to the remote path if they don't exist.
      # Fails if the format is incorrect to prevent overwriting the remote root.
      - name: Parse paths
        id: parse-paths
        env:
          INPUT_PATHS: ${{ inputs.paths }}
        run: |
          IFS=',' read -r -a input_paths <<< "$INPUT_PATHS";
          final_paths=()
          for p in "${input_paths[@]}"; do
            # Trim whitespace from the segment
            p=$(printf "%s" "$p" | xargs)
            [[ -z "$p" ]] && continue

            if [[ "$p" == *":"* ]]; then
              IFS=':' read -r -a parts <<< "$p";
              if [[ ${#parts[@]} -ne 2 ]]; then
                printf "::error::Invalid path format: '%s'. Expected 'local:remote' or 'local'.\n" "$p"
                exit 1
              fi
              local_p=$(printf "%s" "${parts[0]}" | xargs)
              remote_p=$(printf "%s" "${parts[1]}" | xargs)
            else
              local_p="$p"
              remote_p="$p"
            fi

            if [[ -z "$local_p" ]]; then
              printf "::error::Local path cannot be empty in '%s'.\n" "$p"
              exit 1
            fi
            if [[ -z "$remote_p" ]]; then
              printf "::error::Remote path cannot be empty in '%s'. If you want to use the local path as remote, just omit the colon.\n" "$p"
              exit 1
            fi

            # Normalize local path: remove leading slash
            local_p="${local_p#/}"
            # Normalize remote path: ensure leading slash
            if [[ "$remote_p" != /* ]]; then
              remote_p="/$remote_p"
            fi

            final_paths+=("$local_p:$remote_p")
          done

          if [[ ${#final_paths[@]} -eq 0 ]]; then
            printf "::error::No valid paths found in '%s'.\n" "$INPUT_PATHS"
            exit 1
          fi
          echo "DEPLOY_PATHS=${final_paths[*]}" >> $GITHUB_ENV

      # We need to set the server url to the base path
      # Preserve preceding (or lack of) slash to allow for absolute or relative paths.
      # Remove trailing slash, because leading slashes are added to deploy paths.
      - name: Set server url
        run: |
          base_path="${{ inputs.base_path }}"
          base_path="${base_path%/}"
          echo "SERVER_URL=${{ inputs.server_url }}:${base_path}" >> $GITHUB_ENV

      # We deploy the files defined in the paths
      - name: Deploy files
        run: |
          for path in $DEPLOY_PATHS; do
            IFS=':' read -r -a path <<< "$path";
            echo "Deploying ${path[0]} to ${path[1]}";
            rsync -rlci -e "ssh -p ${{ env.SSH_PORT }}" --verbose --delete --exclude=${{ env.EXCLUDE }} ${path[0]} ${{ env.SERVER_URL }}${path[1]};
          done;
        env:
          DEPLOY_PATHS: ${{ env.DEPLOY_PATHS }}
          SSH_PORT: ${{ inputs.ssh_port }}

      - uses: slackapi/slack-github-action@v1
        name: Slack notification (success)
        if: ${{ success() && inputs.slack_channel != '' }}
        with:
          # Unlike the step posting a new message, this step does not accept a channel name.
          # Please use a channel ID, not a name here.
          channel-id: ${{ inputs.slack_channel }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "text": ":white_check_mark: ${{ github.repository }} deployment ${{ github.ref_name }} to ${{ inputs.server_url }} finished.",
              "attachments": [
                {
                  "pretext": ":airplane_arriving: Finished deploying",
                  "color": "28a745",
                  "fields": [
                    {
                      "title": "Status",
                      "short": true,
                      "value": "Completed"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - uses: slackapi/slack-github-action@v1
        name: Slack notification (failure)
        if: ${{ failure() && inputs.slack_channel != '' }}
        with:
          # Unlike the step posting a new message, this step does not accept a channel name.
          # Please use a channel ID, not a name here.
          channel-id: ${{ inputs.slack_channel }}
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "text": ":x: ${{ github.repository }} deployment ${{ github.ref_name }} to ${{ inputs.server_url }} failed!",
              "attachments": [
                {
                  "pretext": ":fire: Failed to deploy",
                  "color": "e11d21",
                  "fields": [
                    {
                      "title": "Status",
                      "short": true,
                      "value": "Failed"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
